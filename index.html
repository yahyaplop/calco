<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Calc X</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg1: #0f0f1e;
    --bg2: #1a1a2e;
    --bg3: #252540;
    --accent-h: 262;
    --accent-s: 83%;
    --accent-l: 58%;
    --accent: hsl(var(--accent-h) var(--accent-s) var(--accent-l));
    --accent2: hsl(calc(var(--accent-h) + 60) var(--accent-s) 60%);
    --btn-bg: rgba(255,255,255,0.055);
    --btn-bg-hover: rgba(255,255,255,0.12);
    --btn-text: #ffffff;
    --display-text: #ffffff;
    --muted: rgba(255,255,255,0.45);
    --op-bg: hsla(var(--accent-h) var(--accent-s) var(--accent-l) / 0.16);
    --op-text: hsl(var(--accent-h) var(--accent-s) 70%);
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --glass: rgba(255,255,255,0.04);
  }
  [data-theme="light"] {
    --bg1: #eef0f8;
    --bg2: #ffffff;
    --bg3: #f4f4fa;
    --btn-bg: rgba(0,0,0,0.045);
    --btn-bg-hover: rgba(0,0,0,0.09);
    --btn-text: #1a1a2e;
    --display-text: #1a1a2e;
    --muted: rgba(0,0,0,0.4);
    --op-bg: hsla(var(--accent-h) var(--accent-s) var(--accent-l) / 0.14);
    --op-text: hsl(var(--accent-h) var(--accent-s) 45%);
    --shadow: 0 8px 32px rgba(0,0,0,0.08);
    --glass: rgba(0,0,0,0.02);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg3), var(--bg1) 60%), var(--bg2);
    color: var(--display-text);
    transition: background 0.5s ease, color 0.3s;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
  }

  .app {
    width: 100%;
    max-width: 440px;
    height: 100vh;
    height: 100dvh;
    max-height: 940px;
    display: flex;
    flex-direction: column;
    padding: 14px 16px 20px;
    position: relative;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    flex-shrink: 0;
    min-height: 40px;
  }
  .logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 12px;
    border: none;
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-size: 18px;
  }
  .icon-btn:active { transform: scale(0.92); background: var(--btn-bg-hover); }
  .icon-btn.active {
    background: var(--op-bg);
    color: var(--op-text);
    box-shadow: 0 0 0 1.5px var(--accent) inset;
  }

  /* ---------- Settings panel ---------- */
  .settings {
    position: absolute;
    top: 58px;
    right: 16px;
    left: 16px;
    background: var(--bg2);
    border-radius: 20px;
    padding: 18px;
    box-shadow: var(--shadow);
    z-index: 100;
    display: none;
    border: 1px solid var(--btn-bg);
    animation: slideDown 0.25s ease-out;
  }
  .settings.open { display: block; }
  @keyframes slideDown { from {opacity:0; transform:translateY(-10px);} to {opacity:1; transform:none;} }

  .settings h3 { font-size: 13px; font-weight: 700; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .settings-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .settings-row label { font-size: 13px; min-width: 90px; opacity: 0.75; }
  .hue-slider {
    flex: 1;
    height: 26px;
    border-radius: 13px;
    background: linear-gradient(to right,
      hsl(0 83% 58%), hsl(60 83% 58%), hsl(120 83% 58%),
      hsl(180 83% 58%), hsl(240 83% 58%), hsl(300 83% 58%), hsl(360 83% 58%));
    position: relative;
    cursor: pointer;
    touch-action: none;
  }
  .hue-thumb {
    position: absolute;
    top: 50%; left: 262px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #fff;
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    pointer-events: none;
  }
  .theme-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .theme-chip {
    padding: 8px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--btn-bg);
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .theme-chip.active { border-color: var(--accent); background: var(--op-bg); color: var(--op-text); }
  .theme-chip:active { transform: scale(0.95); }

  /* ---------- History ---------- */
  .history {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    padding: 0 4px;
    min-height: 40px;
    scrollbar-width: none;
    mask-image: linear-gradient(to bottom, transparent, black 20%);
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%);
  }
  .history::-webkit-scrollbar { display: none; }
  .history-item {
    font-size: 14px;
    opacity: 0.35;
    margin-bottom: 3px;
    padding: 3px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    animation: fadeIn 0.3s;
    text-align: right;
    word-break: break-all;
  }
  .history-item:active { background: var(--btn-bg); opacity: 0.8; transform: scale(0.97); }
  @keyframes fadeIn { from {opacity:0; transform:translateY(-4px);} to {opacity:0.35; transform:none;} }

  /* ---------- Display ---------- */
  .display {
    text-align: right;
    padding: 6px 4px 14px;
    min-height: 92px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .expression {
    font-size: 17px;
    color: var(--muted);
    min-height: 22px;
    word-break: break-all;
    overflow-wrap: anywhere;
    transition: all 0.15s;
    letter-spacing: 0.2px;
  }
  .result {
    font-size: 52px;
    font-weight: 300;
    letter-spacing: -1.5px;
    word-break: break-all;
    overflow-wrap: anywhere;
    line-height: 1.08;
    transition: font-size 0.15s, opacity 0.15s;
    font-variant-numeric: tabular-nums;
  }
  .result.small { font-size: 40px; }
  .result.tiny  { font-size: 30px; }
  .result.error { color: #ef4444; font-size: 32px; }

  /* ---------- Scientific panel ---------- */
  .sci-panel {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding: 0 2px 10px;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.25s, padding 0.3s;
  }
  .sci-panel.open {
    max-height: 130px;
    opacity: 1;
  }
  .sci-btn {
    padding: 12px 0;
    border-radius: 14px;
    border: none;
    background: var(--btn-bg);
    color: var(--op-text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }
  .sci-btn:active { transform: scale(0.9); background: var(--op-bg); }

  /* ---------- Keypad ---------- */
  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    flex-shrink: 0;
  }
  .btn {
    aspect-ratio: 1;
    border-radius: 22px;
    border: none;
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 25px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s, background 0.2s, box-shadow 0.2s;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    user-select: none;
    position: relative;
    overflow: hidden;
    font-variant-numeric: tabular-nums;
  }
  .btn:active {
    transform: scale(0.94);
    background: var(--btn-bg-hover);
  }
  .btn.op {
    background: var(--op-bg);
    color: var(--op-text);
    font-weight: 600;
    font-size: 26px;
  }
  .btn.fn {
    font-size: 17px;
    font-weight: 700;
    color: var(--op-text);
  }
  .btn.fn.del { color: #ef4444; }
  .btn.eq {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-weight: 700;
    font-size: 26px;
    box-shadow: 0 8px 24px -8px var(--accent);
  }
  .btn.eq:active { box-shadow: 0 2px 12px -4px var(--accent); }

  /* Ripple */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.3;
    transform: scale(0);
    animation: ripple 0.55s ease-out;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(3.5); opacity: 0; } }

  @media (max-height: 720px) {
    .result { font-size: 44px; }
    .result.small { font-size: 34px; }
    .result.tiny { font-size: 26px; }
    .btn { border-radius: 18px; font-size: 22px; }
    .btn.op, .btn.eq { font-size: 23px; }
    .keypad { gap: 8px; }
    .history { min-height: 30px; }
    .display { min-height: 76px; padding-bottom: 8px; }
    .sci-panel.open { max-height: 110px; }
  }
  @media (max-height: 620px) {
    .result { font-size: 38px; }
    .history { display: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="logo">CALC·X</div>
      <div class="actions">
        <button class="icon-btn" id="sciToggle" title="Научный режим">ƒ</button>
        <button class="icon-btn" id="themeToggle" title="Тема">◐</button>
        <button class="icon-btn" id="settingsToggle" title="Настройки">⚙</button>
      </div>
    </div>

    <!-- Settings -->
    <div class="settings" id="settings">
      <h3>Акцентный цвет</h3>
      <div class="settings-row">
        <label>Оттенок</label>
        <div class="hue-slider" id="hueSlider">
          <div class="hue-thumb" id="hueThumb"></div>
        </div>
      </div>
      <h3>Тема</h3>
      <div class="theme-row">
        <button class="theme-chip" data-theme-set="dark">Dark</button>
        <button class="theme-chip" data-theme-set="light">Light</button>
        <button class="theme-chip" data-theme-set="auto">Auto</button>
      </div>
    </div>

    <div class="history" id="history"></div>

    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <!-- Scientific -->
    <div class="sci-panel" id="sciPanel">
      <button class="sci-btn" data-sci="sin">sin</button>
      <button class="sci-btn" data-sci="cos">cos</button>
      <button class="sci-btn" data-sci="tan">tan</button>
      <button class="sci-btn" data-sci="ln">ln</button>
      <button class="sci-btn" data-sci="log">log</button>
      <button class="sci-btn" data-sci="√">√</button>
      <button class="sci-btn" data-sci="^">xʸ</button>
      <button class="sci-btn" data-sci="²">x²</button>
      <button class="sci-btn" data-sci="!">n!</button>
      <button class="sci-btn" data-sci="π">π</button>
    </div>

    <div class="keypad">
      <button class="btn fn" data-val="C">AC</button>
      <button class="btn fn" data-val="⌫">⌫</button>
      <button class="btn fn" data-val="(">(</button>
      <button class="btn fn" data-val=")">)</button>

      <button class="btn" data-val="7">7</button>
      <button class="btn" data-val="8">8</button>
      <button class="btn" data-val="9">9</button>
      <button class="btn op" data-val="/">÷</button>

      <button class="btn" data-val="4">4</button>
      <button class="btn" data-val="5">5</button>
      <button class="btn" data-val="6">6</button>
      <button class="btn op" data-val="*">×</button>

      <button class="btn" data-val="1">1</button>
      <button class="btn" data-val="2">2</button>
      <button class="btn" data-val="3">3</button>
      <button class="btn op" data-val="-">−</button>

      <button class="btn fn" data-val="%">%</button>
      <button class="btn" data-val="0">0</button>
      <button class="btn" data-val=".">.</button>
      <button class="btn op" data-val="+">+</button>

      <button class="btn eq" data-val="=" style="grid-column: 1 / -1; aspect-ratio: auto; height: 56px;">=</button>
    </div>
  </div>

<script>
(() => {
  'use strict';

  // ============ DOM ============
  const $ = id => document.getElementById(id);
  const expressionEl = $('expression');
  const resultEl = $('result');
  const historyEl = $('history');
  const settingsEl = $('settings');
  const sciPanel = $('sciPanel');
  const hueSlider = $('hueSlider');
  const hueThumb = $('hueThumb');

  // ============ STATE ============
  let expr = '';
  let justEvaluated = false;
  let history = JSON.parse(localStorage.getItem('calcx_history') || '[]');

  // ============ SAFE MATH PARSER ============
  // Токенизация + shunting-yard. Без eval.
  function tokenize(str) {
    const tokens = [];
    let i = 0;
    while (i < str.length) {
      const c = str[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9.]/.test(c)) {
        let num = '';
        while (i < str.length && /[0-9.]/.test(str[i])) num += str[i++];
        if ((num.match(/\./g) || []).length > 1) throw new Error('bad num');
        tokens.push({ t: 'num', v: parseFloat(num) });
        continue;
      }
      if ('+-*/^!%'.includes(c)) { tokens.push({ t: 'op', v: c }); i++; continue; }
      if (c === '(') { tokens.push({ t: 'lp' }); i++; continue; }
      if (c === ')') { tokens.push({ t: 'rp' }); i++; continue; }
      if (c === 'π') { tokens.push({ t: 'num', v: Math.PI }); i++; continue; }
      if (c === 'e') { tokens.push({ t: 'num', v: Math.E }); i++; continue; }
      // functions
      const fnMatch = str.slice(i).match(/^(sin|cos|tan|ln|log|√)/);
      if (fnMatch) { tokens.push({ t: 'fn', v: fnMatch[0] }); i += fnMatch[0].length; continue; }
      throw new Error('Unknown char: ' + c);
    }
    return tokens;
  }

  function applyFn(name, x) {
    switch (name) {
      case 'sin': return Math.sin(x);
      case 'cos': return Math.cos(x);
      case 'tan': return Math.tan(x);
      case 'ln':  return x > 0 ? Math.log(x) : NaN;
      case 'log': return x > 0 ? Math.log10(x) : NaN;
      case '√':   return x >= 0 ? Math.sqrt(x) : NaN;
    }
    return NaN;
  }

  // Рекурсивный парсер (приоритеты)
  function parse(tokens) {
    let pos = 0;
    function peek() { return tokens[pos]; }
    function next() { return tokens[pos++]; }

    // expression := term (('+' | '-') term)*
    function parseExpr() {
      let left = parseTerm();
      while (peek() && peek().t === 'op' && (peek().v === '+' || peek().v === '-')) {
        const op = next().v;
        const right = parseTerm();
        left = op === '+' ? left + right : left - right;
      }
      return left;
    }
    // term := factor (('*' | '/' | '%') factor)*
    function parseTerm() {
      let left = parseFactor();
      while (peek() && peek().t === 'op' && (peek().v === '*' || peek().v === '/' || peek().v === '%')) {
        const op = next().v;
        const right = parseFactor();
        if (op === '*') left *= right;
        else if (op === '/') left /= right;
        else if (op === '%') left %= right;
      }
      return left;
    }
    // factor := power
    function parseFactor() {
      return parsePower();
    }
    // power := unary ('^' factor)?  — право-ассоциативный
    function parsePower() {
      let base = parseUnary();
      if (peek() && peek().t === 'op' && peek().v === '^') {
        next();
        const exponent = parsePower();
        base = Math.pow(base, exponent);
      }
      return base;
    }
    // unary := ('-' | '+')? postfix
    function parseUnary() {
      if (peek() && peek().t === 'op' && (peek().v === '-' || peek().v === '+')) {
        const op = next().v;
        const v = parseUnary();
        return op === '-' ? -v : v;
      }
      return parsePostfix();
    }
    // postfix := primary ('!')*
    function parsePostfix() {
      let v = parsePrimary();
      while (peek() && peek().t === 'op' && peek().v === '!') {
        next();
        v = factorial(v);
      }
      return v;
    }
    // primary := num | '(' expr ')' | fn primary
    function parsePrimary() {
      const tok = peek();
      if (!tok) throw new Error('Unexpected end');
      if (tok.t === 'num') { next(); return tok.v; }
      if (tok.t === 'lp') {
        next();
        const v = parseExpr();
        if (!peek() || peek().t !== 'rp') throw new Error('Missing )');
        next();
        return v;
      }
      if (tok.t === 'fn') {
        next();
        const arg = parsePrimary();
        return applyFn(tok.v, arg);
      }
      throw new Error('Unexpected token');
    }

    const result = parseExpr();
    if (pos < tokens.length) throw new Error('Trailing tokens');
    return result;
  }

  function factorial(n) {
    if (n < 0 || !Number.isInteger(n)) return NaN;
    if (n > 170) return Infinity;
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
  }

  function evaluate(str) {
    if (!str) return null;
    try {
      const tokens = tokenize(str);
      if (!tokens.length) return null;
      const val = parse(tokens);
      if (!isFinite(val) || isNaN(val)) return { error: true };
      // Округление от мусора float
      const rounded = Math.round(val * 1e12) / 1e12;
      return { value: rounded };
    } catch {
      return { error: true };
    }
  }

  // ============ FORMAT ============
  function formatNumber(n) {
    if (typeof n !== 'number') return String(n);
    if (Number.isInteger(n) && Math.abs(n) < 1e15) {
      return n.toLocaleString('ru-RU');
    }
    const str = String(n);
    if (str.includes('e') || str.includes('E')) return str;
    const [int, frac] = str.split('.');
    const intFmt = parseInt(int || '0').toLocaleString('ru-RU');
    return frac ? intFmt + ',' + frac : intFmt;
  }

  // ============ UPDATE UI ============
  function update() {
    // expression
    expressionEl.textContent = expr || '';

    // result preview
    if (!expr) {
      resultEl.textContent = '0';
      resultEl.className = 'result';
      return;
    }
    const r = evaluate(expr);
    if (r === null || r.error) {
      // Проверим, может это незаконченное выражение — покажем его
      resultEl.textContent = '…';
      resultEl.className = 'result small';
    } else {
      const formatted = formatNumber(r.value);
      resultEl.textContent = formatted;
      resultEl.className = 'result';
      if (formatted.length > 11) resultEl.className = 'result small';
      if (formatted.length > 16) resultEl.className = 'result tiny';
    }
  }

  // ============ INPUT LOGIC ============
  function lastChar() { return expr.slice(-1); }
  function isDigit(c) { return /[0-9]/.test(c); }
  function isOp(c) { return '+-*/^%'.includes(c); }

  function press(val) {
    switch (val) {
      case 'C':
        expr = '';
        justEvaluated = false;
        break;

      case '⌫':
        if (justEvaluated) { justEvaluated = false; }
        expr = expr.slice(0, -1);
        break;

      case '=': {
        const r = evaluate(expr);
        if (r && !r.error && expr) {
          history.push({ e: expr, v: r.value });
          history = history.slice(-30);
          localStorage.setItem('calcx_history', JSON.stringify(history));
          renderHistory();
          expr = String(r.value);
          justEvaluated = true;
        } else if (r && r.error) {
          resultEl.textContent = 'Ошибка';
          resultEl.className = 'result error';
          return;
        }
        break;
      }

      case '.':
        if (justEvaluated) { expr = '0'; justEvaluated = false; }
        // нельзя две точки в одном числе
        {
          const m = expr.match(/[0-9.]+$/);
          if (m && m[0].includes('.')) return;
          if (!m) expr += '0';
        }
        expr += '.';
        break;

      case '(':
        if (justEvaluated) { expr = ''; justEvaluated = false; }
        // неявное умножение: 2( → 2*(
        if (lastChar() && (isDigit(lastChar()) || lastChar() === ')')) expr += '*';
        expr += '(';
        break;

      case ')':
        {
          const open = (expr.match(/\(/g) || []).length;
          const close = (expr.match(/\)/g) || []).length;
          if (open <= close) return;
          if (isOp(lastChar()) || lastChar() === '(') return;
          expr += ')';
        }
        break;

      default:
        if (isDigit(val)) {
          if (justEvaluated) { expr = ''; justEvaluated = false; }
          expr += val;
          break;
        }
        if (isOp(val)) {
          if (justEvaluated) { justEvaluated = false; }
          if (!expr && val !== '-') return; // нельзя начинать с +,*,/
          const lc = lastChar();
          if (isOp(lc)) {
            // заменить оператор (кроме случая унарного минуса)
            if (val === '-') {
              if (lc === '-') return;
              expr += '-';
            } else {
              expr = expr.slice(0, -1) + val;
            }
          } else if (lc === '(') {
            if (val !== '-') return;
            expr += val;
          } else {
            expr += val;
          }
          break;
        }
        expr += val;
    }
    update();
  }

  // ============ SCIENTIFIC ============
  function pressSci(fn) {
    if (justEvaluated) { expr = ''; justEvaluated = false; }
    switch (fn) {
      case 'π': expr += 'π'; break;
      case '²': expr += '^2'; break;
      case '^': expr += '^'; break;
      case '!': expr += '!'; break;
      case '√': expr += '√'; break;
      case 'sin': case 'cos': case 'tan': case 'ln': case 'log':
        expr += fn + '(';
        break;
    }
    update();
  }

  // ============ HISTORY RENDER ============
  function renderHistory() {
    historyEl.innerHTML = '';
    history.slice(-8).forEach(h => {
      const d = document.createElement('div');
      d.className = 'history-item';
      d.textContent = `${h.e} = ${formatNumber(h.v)}`;
      d.onclick = () => {
        expr = String(h.v);
        justEvaluated = false;
        update();
        if (navigator.vibrate) navigator.vibrate(6);
      };
      historyEl.appendChild(d);
    });
    historyEl.scrollTop = historyEl.scrollHeight;
  }

  // ============ THEME ============
  function applyAccent(hue) {
    document.documentElement.style.setProperty('--accent-h', hue);
    hueThumb.style.left = (hue / 360) * 100 + '%';
    localStorage.setItem('calcx_hue', hue);
  }

  function applyTheme(name) {
    if (name === 'auto') {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    } else {
      document.documentElement.setAttribute('data-theme', name);
    }
    document.querySelectorAll('.theme-chip').forEach(c =>
      c.classList.toggle('active', c.dataset.themeSet === name));
    localStorage.setItem('calcx_theme', name);
    updateThemeColor();
  }

  function updateThemeColor() {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', isLight ? '#eef0f8' : '#0f0f1e');
  }

  // Hue slider drag
  let dragging = false;
  function handleHueAt(clientX) {
    const rect = hueSlider.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.max(0, Math.min(1, pct));
    const hue = Math.round(pct * 360);
    applyAccent(hue);
  }
  hueSlider.addEventListener('pointerdown', e => { dragging = true; handleHueAt(e.clientX); hueSlider.setPointerCapture(e.pointerId); });
  hueSlider.addEventListener('pointermove', e => { if (dragging) handleHueAt(e.clientX); });
  hueSlider.addEventListener('pointerup', () => dragging = false);
  hueSlider.addEventListener('pointercancel', () => dragging = false);

  // Theme buttons
  document.querySelectorAll('.theme-chip').forEach(btn => {
    btn.addEventListener('click', () => applyTheme(btn.dataset.themeSet));
  });

  // System theme change
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (localStorage.getItem('calcx_theme') === 'auto') applyTheme('auto');
  });

  // ============ BUTTONS ============
  function addRipple(btn, e) {
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const r = document.createElement('span');
    r.className = 'ripple';
    const x = (e.clientX || rect.left + rect.width/2) - rect.left;
    const y = (e.clientY || rect.top + rect.height/2) - rect.top;
    r.style.width = r.style.height = size + 'px';
    r.style.left = (x - size/2) + 'px';
    r.style.top = (y - size/2) + 'px';
    btn.appendChild(r);
    setTimeout(() => r.remove(), 550);
  }

  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('click', e => {
      addRipple(btn, e);
      if (navigator.vibrate) navigator.vibrate(8);
      press(btn.dataset.val);
    });
  });

  document.querySelectorAll('.sci-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate(6);
      pressSci(btn.dataset.sci);
    });
  });

  // ============ HEADER ACTIONS ============
  $('sciToggle').addEventListener('click', function() {
    sciPanel.classList.toggle('open');
    this.classList.toggle('active');
    if (navigator.vibrate) navigator.vibrate(8);
  });

  $('themeToggle').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'light' ? 'dark' : 'light');
    if (navigator.vibrate) navigator.vibrate(8);
  });

  $('settingsToggle').addEventListener('click', function() {
    settingsEl.classList.toggle('open');
    this.classList.toggle('active');
    if (navigator.vibrate) navigator.vibrate(8);
  });

  // Закрыть настройки по клику вне
  document.addEventListener('pointerdown', e => {
    if (!settingsEl.contains(e.target) && e.target !== $('settingsToggle') && !$('settingsToggle').contains(e.target)) {
      settingsEl.classList.remove('open');
      $('settingsToggle').classList.remove('active');
    }
  });

  // ============ KEYBOARD ============
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const k = e.key;
    if (/^[0-9]$/.test(k)) press(k);
    else if (k === '.') press('.');
    else if ('+-*/^%'.includes(k)) press(k);
    else if (k === '(' || k === ')') press(k);
    else if (k === 'Enter' || k === '=') { e.preventDefault(); press('='); }
    else if (k === 'Backspace') { e.preventDefault(); press('⌫'); }
    else if (k === 'Escape' || k === 'Delete') press('C');
    else if (k === 'p') pressSci('π');
    else if (k === 'r') pressSci('√');
  });

  // ============ INIT ============
  applyAccent(parseInt(localStorage.getItem('calcx_hue') || '262'));
  applyTheme(localStorage.getItem('calcx_theme') || 'auto');
  renderHistory();
  update();
})();
</script>
</body>
</html>
